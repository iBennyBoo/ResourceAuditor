<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Security Auditor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="auditor-container">
    <div class="progress-container">
        <div class="progress-bar" id="progress"></div>
    </div>

    <div class="step active" id="step-1">
        <h2>Live Security Scan</h2>
        <p>Enter a URL to perform a real-time header audit via proxy.</p>
        <input type="text" id="url-input" placeholder="example.com">
        <small id="error-msg" class="error"></small>
        <div class="btn-group">
            <button class="btn-next" onclick="validateStep1()">Initialize Live Scan</button>
        </div>
    </div>

    <div class="step" id="step-2">
        <h2>Header Analysis</h2>
        <div id="console-log"></div>
        <div class="btn-group">
            <button id="results-btn" class="btn-next" style="display:none;" onclick="goToStep(3)">View Audit Report</button>
        </div>
    </div>

    <div class="step" id="step-3">
        <h2>Audit Results</h2>
        <div id="risk-badge"></div>
        <div id="report-output"></div>
        <div class="btn-group">
            <button class="btn-next" onclick="resetForm()">New Scan</button>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
